# Mac Apple Silicon 覆盖配置
# 使用方式: docker compose -f docker-compose.yml -f docker-compose.mac.yml up -d
#
# Ollama 在 Mac 宿主机原生运行以利用 Metal GPU 加速
# config.yaml 中已配置 host.docker.internal 连接宿主机 Ollama

services:
  # Mac ARM64 平台覆盖 (如果 .env 中未设置)
  wren-engine:
    platform: linux/arm64

  ibis-server:
    platform: linux/arm64

  wren-ai-service:
    platform: linux/arm64

  wren-ui:
    platform: linux/arm64

  bootstrap:
    platform: linux/arm64
