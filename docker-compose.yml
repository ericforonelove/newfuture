version: "3.8"

networks:
  wren:
    driver: bridge

services:
  # ---- PostgreSQL 业务数据库 ----
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wrenai
      POSTGRES_PASSWORD: wrenai123
      POSTGRES_DB: sales
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    networks:
      - wren
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wrenai -d sales"]
      interval: 5s
      timeout: 3s
      retries: 10

  # ---- Bootstrap (初始化 Wren Engine 数据) ----
  bootstrap:
    image: ghcr.io/canner/wren-bootstrap:${WREN_BOOTSTRAP_VERSION}
    platform: ${PLATFORM}
    environment:
      DATA_PATH: /app/data
    volumes:
      - wrendata:/app/data
    command: /bin/sh /app/init.sh
    networks:
      - wren

  # ---- Wren Engine (SQL 引擎) ----
  wren-engine:
    image: ghcr.io/canner/wren-engine:${WREN_ENGINE_VERSION}
    platform: ${PLATFORM}
    restart: unless-stopped
    expose:
      - ${WREN_ENGINE_PORT}
      - ${WREN_ENGINE_SQL_PORT}
    ports:
      - "${WREN_ENGINE_PORT}:${WREN_ENGINE_PORT}"
    volumes:
      - wrendata:/usr/src/app/etc
      - ./data:/usr/src/app/data
    networks:
      - wren
    depends_on:
      - bootstrap

  # ---- Ibis Server (数据源连接层) ----
  ibis-server:
    image: ghcr.io/canner/wren-engine-ibis:${IBIS_SERVER_VERSION}
    platform: ${PLATFORM}
    restart: unless-stopped
    expose:
      - ${IBIS_SERVER_PORT}
    environment:
      WREN_ENGINE_ENDPOINT: http://wren-engine:${WREN_ENGINE_PORT}
    volumes:
      - ./data:/usr/src/app/data
    networks:
      - wren

  # ---- Qdrant (向量数据库) ----
  qdrant:
    image: qdrant/qdrant:v1.11.0
    restart: unless-stopped
    expose:
      - "6333"
      - "6334"
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - wren

  # ---- Wren AI Service (AI 语义层) ----
  wren-ai-service:
    image: ghcr.io/canner/wren-ai-service:${WREN_AI_SERVICE_VERSION}
    platform: ${PLATFORM}
    restart: unless-stopped
    expose:
      - ${WREN_AI_SERVICE_PORT}
    ports:
      - "${AI_SERVICE_FORWARD_PORT}:${WREN_AI_SERVICE_PORT}"
    environment:
      PYTHONUNBUFFERED: 1
      CONFIG_PATH: /app/config.yaml
      WREN_ENGINE_ENDPOINT: http://wren-engine:${WREN_ENGINE_PORT}
    env_file:
      - .env
    volumes:
      - ./config.yaml:/app/config.yaml:ro
      - ./data:/app/data:ro
    networks:
      - wren
    depends_on:
      - qdrant

  # ---- Wren UI (官方管理界面) ----
  wren-ui:
    image: ghcr.io/canner/wren-ui:${WREN_UI_VERSION}
    platform: ${PLATFORM}
    restart: unless-stopped
    environment:
      DB_TYPE: sqlite
      SQLITE_FILE: /app/data/db.sqlite3
      WREN_ENGINE_ENDPOINT: http://wren-engine:${WREN_ENGINE_PORT}
      WREN_AI_ENDPOINT: http://wren-ai-service:${WREN_AI_SERVICE_PORT}
      IBIS_SERVER_ENDPOINT: http://ibis-server:${IBIS_SERVER_PORT}
      WREN_PRODUCT_VERSION: ${WREN_PRODUCT_VERSION}
      GENERATION_MODEL: ${GENERATION_MODEL}
      PLATFORM: docker
      TELEMETRY_ENABLED: ${TELEMETRY_ENABLED}
      POSTHOG_API_KEY: ${POSTHOG_API_KEY}
      POSTHOG_HOST: ${POSTHOG_HOST}
      USER_UUID: ${USER_UUID}
    ports:
      - "${HOST_PORT}:3000"
    volumes:
      - wrendata:/app/data
    networks:
      - wren
    depends_on:
      - wren-ai-service
      - wren-engine

  # ---- 自定义前端 (问答 + 图表) ----
  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8501:8501"
    environment:
      WREN_AI_ENDPOINT: http://wren-ai-service:${WREN_AI_SERVICE_PORT}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: wrenai
      PG_PASSWORD: wrenai123
      PG_DATABASE: sales
    networks:
      - wren
    depends_on:
      - wren-ai-service
      - postgres

volumes:
  pgdata:
  wrendata:
  qdrant_data:
